version: "2.2"
pipelines:
  - id: sink-s3-train-movements-v00
    status: stopped
    description: Migrated from Kafka Connect connector "sink-s3-train-movements-v00" (io.confluent.connect.s3.S3SinkConnector) by conduit <VERSION>; report sha256:<REPORT_SHA256>
    connectors:
      - id: source
        type: source
        plugin: builtin:kafka
        settings:
          groupID: connect-sink-s3-train-movements-v00
          readFromBeginning: "true"
          servers: ${KC_SINK_S3_TRAIN_MOVEMENTS_V00_SOURCE_SERVERS}
          topics: TRAIN_MOVEMENTS_ACTIVATIONS_SCHEDULE_00
      - id: destination
        type: destination
        plugin: builtin:s3
        settings:
          aws.bucket: example-rail-streaming-bucket
          aws.region: us-west-2
          format: ${KC_SINK_S3_TRAIN_MOVEMENTS_V00_DESTINATION_FORMAT}
          sdk.batch.size: "65536"
