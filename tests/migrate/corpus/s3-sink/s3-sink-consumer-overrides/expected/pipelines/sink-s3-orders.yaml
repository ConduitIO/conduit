version: "2.2"
pipelines:
  - id: sink-s3-orders
    status: stopped
    description: Migrated from Kafka Connect connector "sink-s3-orders" (io.confluent.connect.s3.S3SinkConnector) by conduit <VERSION>; report sha256:<REPORT_SHA256>
    connectors:
      - id: source
        type: source
        plugin: builtin:kafka
        settings:
          groupID: orders-archive
          readFromBeginning: "false"
          servers: ${KC_SINK_S3_ORDERS_SOURCE_SERVERS}
          topics: orders
      - id: destination
        type: destination
        plugin: builtin:s3
        settings:
          aws.bucket: example-orders-bucket
          aws.region: us-west-2
          format: ${KC_SINK_S3_ORDERS_DESTINATION_FORMAT}
          sdk.batch.size: "100"
