schemaVersion: 1
id: s3-sink-smt-grouping
family: s3-sink
description: >-
  An S3 sink whose SMT configuration Kafka Connect itself rejects: an alias
  listed twice, a listed alias with no type, and a transform that names an
  undefined predicate. Every SMT key blocks with the reason, and the settings
  of an alias transforms= does not list (one a config-provider reference) are
  no-ops, as Kafka Connect ignores them.
provenance:
  source: synthetic
  ref: written for the SMT chain framework (design 20261110-kafka-connect-smt-pack.md)
  license: Apache-2.0
sanitized: {scrubbed: true, check: scrub-v1}
upstream: {kafka-connect-s3: "12.1.5", connect: "4.2"}
command: {args: [migrate, kafka-connect, input/sink-s3-events.json]}
expect:
  exitCode: 2
  entries:
    - {key: transforms, status: unsupported, blocking: true, code: kc.smt_unsupported}
    - {key: transforms.drop.type, status: unsupported, blocking: true, code: kc.smt_unsupported}
    - {key: transforms.drop.predicate, status: unsupported, blocking: true, code: kc.smt_unsupported}
    - {key: transforms.hoist.type, status: translated, blocking: false}
    - {key: transforms.hoist.field, status: translated, blocking: false}
    - {key: s3.bucket.name, status: translated}
covers:
  - class: io.confluent.connect.s3.S3SinkConnector
    keys: [s3.bucket.name, s3.region, flush.size, storage.class, format.class]
emits:
  - {plugin: builtin:kafka, role: source}
  - {plugin: builtin:s3, role: destination}
run: {tier: offline}
