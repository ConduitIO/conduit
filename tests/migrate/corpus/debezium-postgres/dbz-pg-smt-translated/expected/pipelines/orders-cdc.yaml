            settings:
              fields: .Metadata["opencdc.payload.schema.subject"],.Metadata["opencdc.payload.schema.version"]
          - id: smt-trim-3
            plugin: error
            condition: '{{ and (regexMatch `^(?:cdc\.orders)$` (ternary (regexReplaceAll `^(?:shop\.public\.(.*))` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) `cdc.${1}`) (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) (regexMatch `^(?:shop\.public\.(.*))$` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection"))))))) (and (eq (printf "%T" .Payload.After) "opencdc.StructuredData") (hasKey .Payload.After "customer_id")) }}'
            settings:
              message: 'transform trim (ReplaceField): the rename target customer_id is already a field of the record, which Kafka Connect fails'
          - id: smt-trim-4
            plugin: field.rename
            condition: '{{ and (regexMatch `^(?:cdc\.orders)$` (ternary (regexReplaceAll `^(?:shop\.public\.(.*))` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) `cdc.${1}`) (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) (regexMatch `^(?:shop\.public\.(.*))$` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection"))))))) (and (eq (printf "%T" .Payload.After) "opencdc.StructuredData") (hasKey .Payload.After "cust_id")) }}'
            settings:
              mapping: .Payload.After.cust_id:customer_id
          - id: smt-trim-5
            plugin: field.rename
            condition: '{{ and (regexMatch `^(?:cdc\.orders)$` (ternary (regexReplaceAll `^(?:shop\.public\.(.*))` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) `cdc.${1}`) (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) (regexMatch `^(?:shop\.public\.(.*))$` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection"))))))) (and (ne (printf "%T" .Payload.Before) "<nil>") (and (eq (printf "%T" .Payload.Before) "opencdc.StructuredData") (hasKey .Payload.Before "cust_id")) (not (and (eq (printf "%T" .Payload.Before) "opencdc.StructuredData") (hasKey .Payload.Before "customer_id")))) }}'
            settings:
              mapping: .Payload.Before.cust_id:customer_id
      - id: destination
        type: destination
        plugin: builtin:kafka
        settings:
          servers: ${KC_ORDERS_CDC_DESTINATION_SERVERS}
          topic: '{{ ternary (regexReplaceAll `^(?:shop\.public\.(.*))` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) `cdc.${1}`) (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) (regexMatch `^(?:shop\.public\.(.*))$` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection"))))) }}'
