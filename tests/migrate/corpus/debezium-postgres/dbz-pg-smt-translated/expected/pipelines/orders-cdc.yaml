version: "2.2"
pipelines:
  - id: orders-cdc
    status: stopped
    description: Migrated from Kafka Connect connector "orders-cdc" (io.debezium.connector.postgresql.PostgresConnector) by conduit <VERSION>; report sha256:<REPORT_SHA256>
    connectors:
      - id: source
        type: source
        plugin: builtin:postgres
        settings:
          tables: orders,order_lines
          url: host=postgres.internal.example port=5432 user=postgres password=${KC_ORDERS_CDC_DATABASE_PASSWORD} dbname=orders search_path=public
        processors:
          - id: smt-dropDeletes
            plugin: filter
            condition: '{{ eq (printf "%v" .Operation) "delete" }}'
          - id: smt-schema-value
            plugin: field.exclude
            condition: '{{ and (regexMatch `^(?:cdc\.orders)$` (ternary (regexReplaceAll `^(?:shop\.public\.(.*))` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) `cdc.${1}`) (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) (regexMatch `^(?:shop\.public\.(.*))$` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection"))))))) (ne (printf "%T" .Payload.After) "<nil>") }}'
            settings:
              fields: .Metadata["opencdc.payload.schema.subject"],.Metadata["opencdc.payload.schema.version"]
          - id: smt-trim-1
            plugin: field.exclude
            condition: '{{ and (regexMatch `^(?:cdc\.orders)$` (ternary (regexReplaceAll `^(?:shop\.public\.(.*))` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) `cdc.${1}`) (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) (regexMatch `^(?:shop\.public\.(.*))$` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection"))))))) (ne (printf "%T" .Payload.After) "<nil>") }}'
            settings:
              fields: .Payload.After.internal_notes
          - id: smt-schema-value-2
            plugin: field.exclude
            condition: '{{ and (regexMatch `^(?:cdc\.orders)$` (ternary (regexReplaceAll `^(?:shop\.public\.(.*))` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) `cdc.${1}`) (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) (regexMatch `^(?:shop\.public\.(.*))$` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection"))))))) (ne (printf "%T" .Payload.Before) "<nil>") }}'
            settings:
              fields: .Metadata["opencdc.payload.schema.subject"],.Metadata["opencdc.payload.schema.version"]
          - id: smt-trim-2
            plugin: field.exclude
            condition: '{{ and (regexMatch `^(?:cdc\.orders)$` (ternary (regexReplaceAll `^(?:shop\.public\.(.*))` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) `cdc.${1}`) (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection")))) (regexMatch `^(?:shop\.public\.(.*))$` (print "shop." (ternary (index .Metadata "opencdc.collection") (print "public." (index .Metadata "opencdc.collection")) (contains "." (index .Metadata "opencdc.collection"))))))) (ne (printf "%T" .Payload.Before) "<nil>") }}'
