version: "2.2"
pipelines:
  - id: inventory-source
    status: stopped
    description: Migrated from Kafka Connect connector "inventory-source" (io.debezium.connector.postgresql.PostgresConnector) by conduit <VERSION>; report sha256:<REPORT_SHA256>
    connectors:
      - id: source
        type: source
        plugin: builtin:postgres
        settings:
          tables: '*'
          url: host=pgbouncer.internal.example port=5432 user=user password=${KC_INVENTORY_SOURCE_DATABASE_PASSWORD} dbname=inventorydb
      - id: destination
        type: destination
        plugin: builtin:kafka
        settings:
          servers: ${KC_INVENTORY_SOURCE_DESTINATION_SERVERS}
