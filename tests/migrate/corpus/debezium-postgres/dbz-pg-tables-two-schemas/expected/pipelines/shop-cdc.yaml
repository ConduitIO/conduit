version: "2.2"
pipelines:
  - id: shop-cdc
    status: stopped
    description: Migrated from Kafka Connect connector "shop-cdc" (io.debezium.connector.postgresql.PostgresConnector) by conduit <VERSION>; report sha256:<REPORT_SHA256>
    connectors:
      - id: source
        type: source
        plugin: builtin:postgres
        settings:
          tables: ${KC_SHOP_CDC_SOURCE_TABLES}
          url: host=postgres.internal.example port=5432 user=postgres password=${KC_SHOP_CDC_DATABASE_PASSWORD} dbname=shop
      - id: destination
        type: destination
        plugin: builtin:kafka
        settings:
          servers: ${KC_SHOP_CDC_DESTINATION_SERVERS}
