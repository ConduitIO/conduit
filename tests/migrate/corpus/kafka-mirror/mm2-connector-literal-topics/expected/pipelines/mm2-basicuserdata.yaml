version: "2.2"
pipelines:
  - id: mm2-basicuserdata
    status: stopped
    description: Migrated from Kafka Connect connector "mm2-basicuserdata" (org.apache.kafka.connect.mirror.MirrorSourceConnector) by conduit <VERSION>; report sha256:<REPORT_SHA256>
    connectors:
      - id: source
        type: source
        plugin: builtin:kafka
        settings:
          readFromBeginning: "true"
          servers: source-kafka-bootstrap.internal.example:9092
          topics: basicuserdata
      - id: destination
        type: destination
        plugin: builtin:kafka
        settings:
          servers: target-kafka-bootstrap.internal.example:9092
          topic: source.{{ index .Metadata "opencdc.collection" }}
