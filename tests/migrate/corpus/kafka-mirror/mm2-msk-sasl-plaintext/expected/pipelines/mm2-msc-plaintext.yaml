version: "2.2"
pipelines:
  - id: mm2-msc-plaintext
    status: stopped
    description: Migrated from Kafka Connect connector "mm2-msc-plaintext" (org.apache.kafka.connect.mirror.MirrorSourceConnector) by conduit <VERSION>; report sha256:<REPORT_SHA256>
    connectors:
      - id: source
        type: source
        plugin: builtin:kafka
        settings:
          readFromBeginning: "true"
          servers: b-1.source.internal.example:9092
          topics: orders
      - id: destination
        type: destination
        plugin: builtin:kafka
        settings:
          saslMechanism: PLAIN
          saslPassword: ${KC_MM2_MSC_PLAINTEXT_TARGET_CLUSTER_SASL_JAAS_CONFIG}
          saslUsername: example-user
          servers: b-1.target.internal.example:9092
          tls.enabled: "true"
          topic: msksource.{{ index .Metadata "opencdc.collection" }}
