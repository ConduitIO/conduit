schemaVersion: 1
id: mm2-heartbeat-sasl-scram
family: kafka-mirror
description: >-
  AWS sample for migrating to MSK, the heartbeat connector: SASL/SCRAM on both clusters. It copies no data and produces no pipeline; every key is unsupported and none blocks.
provenance:
  source: vendor-doc
  ref: https://github.com/aws-samples/mirrormaker2-msk-migration/blob/eb595196b48b7fcae15e674ed3e796e220e2214a/Configuration/connectors/sasl-scram/mm2-hbc-sasl-auth.json
  license: MIT-0
  copyright: Amazon.com, Inc. or its affiliates
  modifications:
    - "bootstrap placeholders filled with b-1.source.internal.example and b-1.target.internal.example"
    - "JAAS username placeholder set to example-user, password replaced with a PLACEHOLDER_SECRET_ canary"
sanitized: {scrubbed: true, check: scrub-v1}
upstream: {kafka: "4.2"}
command: {args: [migrate, kafka-connect, input/mm2-hbc.json]}
expect:
  exitCode: 0
  entries:
    - {key: connector.class, status: unsupported, blocking: false, code: kc.connector_class_unsupported}
    - {key: emit.heartbeats.interval.seconds, status: unsupported, blocking: false, code: kc.connector_class_unsupported}
    - {key: source.cluster.sasl.jaas.config, status: unsupported, blocking: false, secret: true}
covers:
  - class: org.apache.kafka.connect.mirror.MirrorHeartbeatConnector
    keys: [emit.heartbeats.interval.seconds, heartbeats.topic.replication.factor, source.cluster.sasl.jaas.config]
run: {tier: offline}
