version: 2
builds:
  - main: ./cmd/conduit/main.go
    id: conduit
    binary: conduit
    goos:
      - darwin
      - linux
      - windows
    ignore:
      - goos: windows
        goarch: "386"
    env:
      - CGO_ENABLED=0
    tags:
      - ui
    ldflags:
      - "-s -w -X 'github.com/conduitio/conduit/pkg/conduit.version={{ .Tag }}'"
    hooks:
      post:
        # Developer ID-sign and notarize darwin binaries so a browser-downloaded
        # release is not killed by Gatekeeper. No-op for non-darwin targets, for
        # nightly tags, and whenever QUILL_SIGN_P12 is unset — see the script.
        - cmd: ./scripts/sign-darwin.sh "{{ .Path }}" "{{ .Target }}"
          output: true
archives:
  - ids:
      - conduit
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
# One SPDX SBOM per archive, written next to it as <archive>.sbom.json and
# listed in checksums.txt, so the signature below covers the SBOMs too.
# `--enrich all` (GoReleaser's default) is left off: it makes syft call out to
# package registries for license data, adding a network dependency to the
# tag-time release. Module names, versions and hashes come from the binary's
# Go build info either way.
sboms:
  - artifacts: archive
    args: ["$artifact", "--output", "spdx-json=$document"]
# Keyless Sigstore signature over checksums.txt. cosign gets a short-lived
# certificate from the GitHub Actions OIDC token, so there is no key to store
# or leak; the certificate names this repo, release.yml and the tag. Signing
# checksums.txt covers every archive, package and SBOM it lists.
# Verification: docs/releases.md, "Verifying a release".
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^npm:'
      - '^go.mod:'
      - '^.github:'
      - '^docker:'
      - Merge branch
release:
  prerelease: auto
  mode: append
  footer: |
    ## Release Artifacts

    ### OSX Darwin
    
    - 📦 [conduit_{{ .Version }}_Darwin_arm64.tar.gz](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Darwin_arm64.tar.gz)
    - 📦 [conduit_{{ .Version }}_Darwin_x86_64.tar.gz](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Darwin_x86_64.tar.gz)
    
    ### Linux
    
    - 📦 [conduit_{{ .Version }}_Linux_arm64.deb](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Linux_arm64.deb)
    - 📦 [conduit_{{ .Version }}_Linux_arm64.rpm](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Linux_arm64.rpm)
    - 📦 [conduit_{{ .Version }}_Linux_arm64.tar.gz](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Linux_arm64.tar.gz)
    - 📦 [conduit_{{ .Version }}_Linux_i386.deb](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Linux_i386.deb)
    - 📦 [conduit_{{ .Version }}_Linux_i386.rpm](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Linux_i386.rpm)
    - 📦 [conduit_{{ .Version }}_Linux_i386.tar.gz](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Linux_i386.tar.gz)
    - 📦 [conduit_{{ .Version }}_Linux_x86_64.deb](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Linux_x86_64.deb)
    - 📦 [conduit_{{ .Version }}_Linux_x86_64.rpm](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Linux_x86_64.rpm)
    - 📦 [conduit_{{ .Version }}_Linux_x86_64.tar.gz](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Linux_x86_64.tar.gz)
    
    ### Windows
    
    - 📦 [conduit_{{ .Version }}_Windows_arm64.zip](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Windows_arm64.zip)
    - 📦 [conduit_{{ .Version }}_Windows_x86_64.zip](https://conduit.gateway.scarf.sh/conduit/download/{{ .Tag }}/conduit_{{ .Version }}_Windows_x86_64.zip)

    ## Verifying

    `checksums.txt` is signed with [Sigstore](https://www.sigstore.dev/) keyless signing (`checksums.txt.sigstore.json`), and each archive has an SPDX SBOM. The Docker image is signed by digest. See [Verifying a release](https://github.com/ConduitIO/conduit/blob/main/docs/releases.md#verifying-a-release).

    ```
    cosign verify-blob \
      --certificate-identity 'https://github.com/ConduitIO/conduit/.github/workflows/release.yml@refs/tags/{{ .Tag }}' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      --bundle checksums.txt.sigstore.json checksums.txt
    sha256sum --check --ignore-missing checksums.txt
    ```

    ## Docker images

    To pull the image, you can execute the following command:
    ```
    docker pull conduit.docker.scarf.sh/conduitio/conduit:{{ .Tag }}
    ```
    ![conduit-release-view](https://static.scarf.sh/a.png?x-pxid=3df89eef-1623-4cd5-9dbc-a6b36588a0eb)
nfpms:
  - license: Apache-2.0
    maintainer: Conduit Developers <conduit-dev@meroxa.io>
    homepage: https://conduitdata.io/
    description: "Conduit streams data between data stores. Kafka Connect replacement. No JVM required."
    section: utils
    formats:
      - rpm
      - deb
    file_name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
