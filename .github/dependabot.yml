# Docs: https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates
version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: ".github:"

  # Maintain dependencies for Go
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "go.mod:"
    ignore:
      # grpc v1.84.0 is affected by GO-2026-6443 / CVE-2026-84445
      # (https://pkg.go.dev/vuln/GO-2026-6443): server panic on a request with
      # no :authority or Host header. The fixed releases are v1.82.2 and
      # v1.83.2; there is no fixed v1.84.x, so main pins v1.83.2. Lift this
      # entry when a fixed v1.84.x or v1.85.0 is tagged and bump to that.
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.0"]

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The Go toolchain stays on 1.25.x until the coordinated fleet move in
      # v0.21 (commons, conduit and every built-in connector together). Patch
      # bumps inside 1.25 are still proposed. Lift this with that move.
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "docker:"

  # Maintain dependencies for Go tools
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Go tools:"

  - package-ecosystem: "docker-compose"
    directory: "/test"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker-compose:"
