name: roadmap

on:
  issues:
    types: [labeled, unlabeled]

# Least privilege: declared so this workflow does not inherit the repository's
# default token scope. It only reads the repository (updates the roadmap board with the PROJECT_AUTOMATION token, not with github.token).
permissions:
  contents: read

jobs:
  roadmap:
    uses: ConduitIO/automation/.github/workflows/roadmap.yml@main
    secrets:
      project-automation-token: ${{ secrets.PROJECT_AUTOMATION }}
