name: debezium goldens

# Re-captures the Debezium golden files (tests/debezium) from the pinned
# Debezium images and fails when a fresh capture no longer reproduces the
# committed files, wall-clock fields aside (tests/debezium/cmd/goldendiff).
#
# The goldens are the specification for the Debezium-compatible output mode
# (docs/design-documents/20261012-debezium-compatible-output.md, #3032). This
# job keeps them honest: a capture that cannot be reproduced is not a
# specification.
#
# Not a required check. It runs weekly, on demand, and on PRs that touch the
# harness; the path filter is fine because nothing depends on it reporting.

on:
  schedule:
    # Monday 07:10 UTC, clear of govulncheck (05:15), the release-branch job
    # (06:30) and the link check (06:40).
    - cron: '10 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/debezium/**'
      - '.github/workflows/debezium-golden.yml'

permissions:
  contents: read
  issues: write

jobs:
  reproduce:
    name: tests/debezium goldens (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['2.7.4', '3.7.0']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Keep the committed goldens
        run: cp -R tests/debezium/testdata/golden "$RUNNER_TEMP/committed"

      - name: Capture
        run: |
          for converter in json json-numeric json-txmeta json-noschema avro; do
            timeout 900 tests/debezium/capture.sh "${{ matrix.version }}" "$converter"
          done

      - name: Compare with the committed goldens
        run: |
          mkdir -p "$RUNNER_TEMP/fresh"
          cp -R "tests/debezium/testdata/golden/${{ matrix.version }}" "$RUNNER_TEMP/fresh/"
          mkdir -p "$RUNNER_TEMP/committed-one"
          cp -R "$RUNNER_TEMP/committed/${{ matrix.version }}" "$RUNNER_TEMP/committed-one/"
          go run ./tests/debezium/cmd/goldendiff "$RUNNER_TEMP/committed-one" "$RUNNER_TEMP/fresh"

      - name: Upload the fresh capture
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debezium-goldens-${{ matrix.version }}
          path: tests/debezium/testdata/golden/${{ matrix.version }}

      - name: File an issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v8
        env:
          VERSION: ${{ matrix.version }}
        with:
          script: |
            const title = `Debezium goldens no longer reproduce (${process.env.VERSION})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The weekly re-capture of the Debezium ${process.env.VERSION} goldens failed: ${runUrl}`,
              '',
              'The run log lists every differing event, and the fresh capture is attached',
              'as an artifact. A real difference means the pinned image or the stack',
              'changed behaviour; the goldens are the specification for the',
              'Debezium-compatible output mode (#3032), so do not re-capture over them',
              'without finding out why.',
            ].join('\n');
            // Dedupe on title rather than a label, as link-check.yml does.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
