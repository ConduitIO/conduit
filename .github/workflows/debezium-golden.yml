name: debezium goldens

# Re-captures the Debezium golden files (tests/debezium) from the pinned
# Debezium images and fails when a fresh capture no longer reproduces the
# committed files, wall-clock fields aside (tests/debezium/cmd/goldendiff).
#
# The goldens are the specification for the Debezium-compatible output mode
# (docs/design-documents/20261012-debezium-compatible-output.md, #3032). This
# job keeps them honest: a capture that cannot be reproduced is not a
# specification.
#
# Not a required check. It runs weekly, on demand, and on PRs that touch the
# harness; the path filter is fine because nothing depends on it reporting.

on:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/debezium/**'
      - '.github/workflows/debezium-golden.yml'

jobs:
  reproduce:
    name: tests/debezium goldens (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['2.7.4', '3.7.0']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Keep the committed goldens
        run: cp -R tests/debezium/testdata/golden "$RUNNER_TEMP/committed"

      - name: Capture
        run: |
          for converter in json json-numeric json-noschema avro; do
            timeout 900 tests/debezium/capture.sh "${{ matrix.version }}" "$converter"
          done

      - name: Compare with the committed goldens
        run: |
          mkdir -p "$RUNNER_TEMP/fresh"
          cp -R "tests/debezium/testdata/golden/${{ matrix.version }}" "$RUNNER_TEMP/fresh/"
          mkdir -p "$RUNNER_TEMP/committed-one"
          cp -R "$RUNNER_TEMP/committed/${{ matrix.version }}" "$RUNNER_TEMP/committed-one/"
          go run ./tests/debezium/cmd/goldendiff "$RUNNER_TEMP/committed-one" "$RUNNER_TEMP/fresh"

      - name: Upload the fresh capture
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debezium-goldens-${{ matrix.version }}
          path: tests/debezium/testdata/golden/${{ matrix.version }}
