name: "Run 'buf update'"

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1'

# Least privilege: nothing at the top, and the one job takes exactly what
# create-pull-request needs. Declared so this workflow does not inherit the
# repository's default token scope.
permissions: {}

jobs:
  update-buf-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the update-buf-dependencies branch (never main)
      pull-requests: write  # open the PR
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Run 'buf update'
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          make install-tools proto-update

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          title: Update Buf dependencies
          body: Automatic pull request for updating Buf dependencies
          branch: update-buf-dependencies
          commit-message: "[automated] Update Buf dependencies"
