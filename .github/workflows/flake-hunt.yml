name: flake hunt

# Issue #2534: the PR-gating `test` workflow runs the suite once per PR
# (-count=1), which is fast but gives order/timing-dependent flakes very few
# chances to show up before they've already cost someone a rerun cycle. This
# workflow repeats the same suite multiple times on a schedule, off the
# critical path, so flakes surface here instead of on a contributor's PR.
#
# Deliberately not wired into branch protection: a red run here is a signal
# to go fix a flaky test, not a reason to block merges.

on:
  schedule:
    # Nightly, off-peak. Cron minute/hour offset from trigger-nightly.yml so
    # the two scheduled workflows don't contend for runners at the same time.
    - cron: '30 3 * * *'
  workflow_dispatch:

env:
  # Resolve ConduitIO modules directly from GitHub (skips proxy.golang.org +
  # sum.golang.org index lag on fresh tags); third-party deps still use both.
  GOPRIVATE: github.com/conduitio/*
  GONOSUMDB: github.com/conduitio/*

jobs:
  flake-hunt:
    name: repeat test suite (-count=3 -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Test (repeated x3, shuffled)
        # -count=3 runs every test three times in the same process, which is
        # exactly the kind of repetition that catches tests relying on
        # process-global state (e.g. the math/rand and shared-fixture bugs
        # fixed for #2534). -shuffle=on randomizes ordering on top of that;
        # go test prints the seed it used so a failure here is reproducible
        # locally with `-shuffle=<seed>`.
        #
        # -timeout 30m: go test's timeout is per test binary and covers ALL
        # -count iterations, so the 10m default left each iteration a third of
        # the budget the PR `test` job (-count=1, 10m) gives it. The
        # pkg/plugin/processor/standalone binary compiles and instantiates
        # ~25 MB WASM guests under -race; it took 411-416s here on a fast
        # runner and was killed at 10m on slow ones (same SHA, same tests,
        # 2.25x slower cold compile of the same guest), with no test hung. 30m
        # is 10m per iteration. TestFlakeHuntTimeoutCoversEveryIteration
        # (flakehunt_timeout_test.go) keeps the two in step.
        run: |
          # Resource sampler (same as test.yml): a runner killed for memory
          # ends with "The runner has received a shutdown signal" and exit 143
          # and no FAIL line, so the samples are the only evidence of why.
          ( while sleep 10; do echo "MEMSAMPLE $(date -u +%T) $(free -m | awk 'NR==2{print "used="$3" avail="$7} NR==3{print "swap="$3}' | tr '\n' ' ') top: $(ps -eo rss,args --sort=-rss | sed -n 2,4p | awk '{printf "%dMB:%s ", $1/1024, $2}' | sed 's#/home/runner/work/conduit/conduit/##g')"; done ) &
          SAMPLER=$!
          make test-integration GOTEST_FLAGS="-v -count=3 -shuffle=on -timeout 30m"; ret=$?
          kill "$SAMPLER" 2>/dev/null || true
          exit $ret

      - name: Report outcome
        if: failure()
        run: |
          echo "::warning::Flake hunt found a failure. This does not block merges, but a real flake was caught - investigate and either fix it or file/update a tracking issue referencing ConduitIO/conduit#2534."
