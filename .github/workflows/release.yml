name: Release

on:
  push:
    tags:
      - v*

# Each job declares exactly what it needs. id-token: write lets a job mint a
# GitHub OIDC token, which cosign exchanges for a short-lived Sigstore
# certificate bound to this workflow and ref (keyless signing, no stored keys).
permissions: {}

jobs:
  # Release gates (postmortem docs/postmortems/20261021-data-loss-and-process-failures.md,
  # items 10 and 12). `make release-check` fails the tag before anything is
  # published. Nightly tags skip it; every publishing job below needs it, and
  # runs only if it succeeded or was skipped (a failure, cancel or missing
  # result stops the release).
  release-check:
    name: Release gates
    if: ${{ !contains(github.ref, '-nightly') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gate script tests
        working-directory: .github/scripts
        run: python3 -m unittest -v test_release_fixes test_release_notes_check

      - name: Run the release gates
        run: make release-check TAG="$GITHUB_REF_NAME"

  release:
    name: Release
    needs: [release-check]
    if: ${{ always() && (needs.release-check.result == 'success' || needs.release-check.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless cosign signature over checksums.txt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      # GoReleaser's `signs` step shells out to cosign to sign checksums.txt.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # GoReleaser's `sboms` step shells out to syft, one SBOM per archive.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: 'v1.54.0'

      # Fail here, before anything is published, if either tool is missing.
      - name: Check signing tools
        run: |
          cosign version
          syft version

      - name: Set GORELEASER_PREVIOUS_TAG in actual release
        if: ${{ !contains(github.ref, '-nightly') }}
        # find previous tag by filtering out nightly tags and choosing the
        # second to last tag (last one is the current release)
        run: |
          prev_tag=$(git tag | grep -v "nightly" | sort -r --version-sort | head -n 2 | tail -n 1)
          echo "GORELEASER_PREVIOUS_TAG=$prev_tag" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          # Pinned to an exact release, not `latest` (which the action
          # resolves to whatever `~> v2` is newest at run time). A minor
          # GoReleaser release can change defaults, deprecate config or alter
          # artifact names, and the tag-time run is the worst moment to find
          # out. v2.18.2 is what the last green nightly before this pin used.
          # Bump it in its own PR and let a nightly prove it before a tag.
          version: 'v2.18.2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  build-push-docker-image:
    name: Build and push Docker image
    needs: [release-check]
    if: ${{ always() && (needs.release-check.result == 'success' || needs.release-check.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image, its signature and its SBOM attestations
      id-token: write # keyless cosign signature and attestations
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      # One list for the build and the per-platform SBOM step, so they cannot
      # drift apart.
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the Container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Makes no sense to have an image with tag v0, hence the check in the last line.
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest-nightly,enable=${{ contains(github.ref, '-nightly')  }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !contains(github.ref, '-nightly') }}
            type=semver,pattern=v{{major}},enable=${{ !contains(github.ref, '-nightly') && !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            maintainer=ConduitIO
            org.opencontainers.image.title=Conduit
            org.opencontainers.image.description=Conduit is a data streaming tool written in Go. It aims to provide the best user experience for building and running real-time data pipelines. Conduit comes with batteries included, it provides a UI, common connectors, transforms and observability data out of the box.
            org.opencontainers.image.vendor=ConduitIO

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # Installed before the build so a missing tool fails the job before
      # anything is pushed.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: 'v1.54.0'

      - name: Check signing tools
        run: |
          cosign version
          syft version

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Sign the multi-arch index by digest, never by tag: a tag can be moved
      # between push and sign, a digest cannot. One signature covers every tag
      # metadata-action applied, since they all point at this digest.
      # Values pass through env, not ${{ }} in the script, so nothing from the
      # event payload is interpolated into the shell.
      - name: Sign Docker image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "unexpected image digest: '$DIGEST'" >&2
            exit 1
          fi
          # GHCR image names must be lowercase; github.repository is ConduitIO/conduit.
          image="${REGISTRY}/${IMAGE_NAME,,}@${DIGEST}"
          cosign sign --yes "$image"

      # One SPDX SBOM per platform image, attested (signed, keyless) on that
      # platform's digest. Not on the index: syft resolves an index to a
      # single platform, so an index-level SBOM would describe one image and
      # claim to cover both. Verification: docs/releases.md, "Verifying a
      # release".
      - name: Attest per-platform SBOMs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          .github/scripts/attest-image-sboms.sh "${REGISTRY}/${IMAGE_NAME,,}" "$DIGEST" "$PLATFORMS"
