name: tier1-review

# Commit status `tier1-review` (postmortem action item 9). Decides from the PR
# body, labels and comments whether the PR has the review CLAUDE.md requires:
# a declared risk tier; for Tier 1, `Review: approve @ <head sha>` and
# `Sign-off @ <head sha>`, and no unanswered `Review: changes-needed`. A push
# changes the head sha, which makes both stale. Rules and limits:
# .github/scripts/tier1_review.py.
#
# Why pull_request_target + issue_comment, and a status instead of a check run:
#   * verdicts arrive as COMMENTS, and an issue_comment run is attached to the
#     default branch, not to the PR head. Posting a commit status on the PR's
#     head sha from both triggers gives one context, `tier1-review`, that a
#     branch-protection rule can require.
#   * both triggers run the DEFAULT branch's copy of this workflow and script.
#     Nothing from the PR is checked out or executed, so a PR cannot edit the
#     gate that judges it. The PR body and comments are data: they go through
#     files, never through a shell command line.
#
# Same-repo and fork PRs both work (pull_request_target has a write token), but
# only because no PR code runs. Do not add a checkout of the PR head here.
#
# What it trusts: verdict comments only from OWNER, MEMBER or COLLABORATOR
# (author_association), the newest verdict per author, and a path floor: a PR
# touching a CODEOWNERS path owned by the signers alone is Tier 1 whatever it
# declares. Dependency manifests are the exception: a `go.mod` or `go.sum`
# change is Tier 1 only when it moves a module in .github/tier1-modules.txt,
# because every Go bump touches `go.mod` and the file is the wrong granularity
# (#3389). Both files come from the default-branch checkout, so a PR cannot
# shrink the list that judges it.
#
# A GitHub App's PR (Dependabot, github-actions) writes its body from a fixed
# template and cannot add a `Risk tier:` line, so it is read as Tier 3 when it
# declares nothing. Both floors still apply on top, so an App's bump of a Tier 1
# module or a Tier 1 path still needs an approve and a sign-off at its current
# head — and a Dependabot rebase moves that head.
#
# The Tier 1 success line names how independent the verdicts were. When the
# approve and the sign-off both come from the PR's own author it reads
# `self-certified by author <login>`, because with one write account there is no
# independence to claim; a second account would add audit noise, not a second
# pair of eyes (#3389). This wording only: a self-certified PR still passes.
#
# KNOWN LIMIT: a required status context can be set by ANY workflow in this
# repository that has `statuses: write`, so a PR that adds such a workflow could
# post a green `tier1-review`. CODEOWNERS on `.github/` (DeVaris alone) and the
# `statuses: write` allowlist in `workflow_permissions_test.go` are the controls
# today. The required context is pinned to app id 15368, so a status written by
# a user PAT does not satisfy it — but every workflow token in this repository
# is that same app, so pinning does not close this. The structural fix is a
# GitHub App that posts a check run, which only that App can write; do that
# before treating this gate as more than a guard against mistakes.
#
# BACKFILL: the gate only ever ran on an event, so a PR opened before the
# workflow existed — or whose last run predates a change to the rules — carried
# NO `tier1-review` status at all, and an absent status is not a failing one.
# The nightly `backfill` job re-decides every open PR with the same script, so
# no open PR sits without a verdict and a rebase that moves the head gets a
# fresh one without waiting for a comment. That is the prerequisite for adding
# this context to main's required checks: requiring a context that some PRs
# never report would block them permanently with nothing to act on (#3389).
# A manual backfill on 2026-11-27 brought open PRs with no status from 21 to 0,
# which is what cleared the way for the line below.
#
# STATUS: live and REQUIRED on main since 2026-11-27 (DeVaris's decision,
# postmortem, "Branch protection"), pinned to app id 15368. With one account
# opening every PR the sign-off comment is only as strong as account
# separation, so what the required context buys is narrower than it looks: no
# PR reaches main without a declared tier, and no Tier 1 PR reaches it without
# an approve and a sign-off at its current head. It does not prove the two
# verdicts came from different people; the success line says so when they did
# not.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    # 04:45 UTC, clear of the other nightlies.
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: One PR number to re-decide; empty for every open PR
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read
  statuses: write
  issues: write # apply the do-not-merge label

concurrency:
  # One backfill at a time, and one run per PR. Cancelling a backfill midway is
  # safe: it re-decides from scratch and never posts a verdict it did not reach.
  group: tier1-review-${{ github.event.pull_request.number || github.event.issue.number || 'backfill' }}
  cancel-in-progress: true

jobs:
  tier1-review:
    name: tier1-review
    if: ${{ github.event_name == 'pull_request_target' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      SIGNERS: devarismeroxa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Gate script tests
        working-directory: .github/scripts
        run: python3 -m unittest -v test_tier1_review

      # The decide-and-post logic lives in the script so the backfill job below
      # runs exactly the same rules; it fetches the PR fresh from the API rather
      # than reading the event, so a re-run after an edit or a deleted comment
      # sees the current state.
      - name: Decide and post the status
        run: .github/scripts/tier1_status.sh "$PR"

  backfill:
    name: tier1-review backfill
    # Never on a PR event: the job above already covers one PR, and a backfill
    # triggered by a PR would re-decide every open PR on every push.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SIGNERS: devarismeroxa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default branch even on a dispatch from another ref: the rules
          # that judge a PR are the merged ones, never a branch's proposal.
          ref: ${{ github.event.repository.default_branch }}

      - name: Gate script tests
        working-directory: .github/scripts
        run: python3 -m unittest -v test_tier1_review

      # The input goes through the environment, not the command line: it is
      # outside input, and the script checks it is a number.
      - name: Post a verdict on every open PR
        env:
          ONLY_PR: ${{ inputs.pr }}
        run: .github/scripts/tier1_backfill.sh "$ONLY_PR"
