# Upstream key snapshot for rules/data/shared.yaml: the connector-level keys
# common to every Kafka Connect connector, with their defaults.
#
# Transcribed by hand from Apache Kafka 4.2 (ConnectorConfig,
# SourceConnectorConfig, SinkConnectorConfig and the generated
# connect_config / source_connector_config / sink_connector_config pages).
# The upstream-drift job (lane-plan PR 20 of the mapping design) will
# regenerate it from the live pages and fail the nightly on any difference.
# A key without "default" has no upstream default (null).
scope: shared
upstream: {name: kafka, version: "4.2"}
sources:
  - https://kafka.apache.org/42/generated/connect_config.html
  - https://kafka.apache.org/42/generated/source_connector_config.html
  - https://kafka.apache.org/42/generated/sink_connector_config.html
# Checked nightly against the source and sink connector pages of 4.2 and of
# the newest documented version (cmd/conduit/internal/kcdrift).
check:
  site: kafka
  pages: [source_connector_config, sink_connector_config]
keys:
  - {key: name}
  - {key: connector.class}
  - {key: connector.plugin.version}
  - {key: tasks.max, default: "1"}
  - {key: tasks.max.enforce, default: "true"}
  - {key: key.converter}
  - {key: key.converter.plugin.version}
  - {key: value.converter}
  - {key: value.converter.plugin.version}
  # The connector page documents null: an absent key inherits the worker's
  # header.converter, whose default is SimpleHeaderConverter.
  - {key: header.converter, default: org.apache.kafka.connect.storage.SimpleHeaderConverter, documented: "null"}
  - {key: header.converter.plugin.version}
  - {key: config.action.reload, default: restart}
  - {key: transforms, default: ""}
  - {key: predicates, default: ""}
  - {key: errors.retry.timeout, default: "0"}
  - {key: errors.retry.delay.max.ms, default: "60000"}
  - {key: errors.tolerance, default: none}
  - {key: errors.log.enable, default: "false"}
  - {key: errors.log.include.messages, default: "false"}
  # Sink connectors.
  - {key: topics, default: ""}
  - {key: topics.regex, default: ""}
  - {key: errors.deadletterqueue.topic.name, default: ""}
  - {key: errors.deadletterqueue.topic.replication.factor, default: "3"}
  - {key: errors.deadletterqueue.context.headers.enable, default: "false"}
  # Source connectors.
  - {key: topic.creation.groups, default: ""}  # List.of(), SourceConnectorConfig.java:133
  - {key: exactly.once.support, default: requested}
  - {key: transaction.boundary, default: poll}
  - {key: transaction.boundary.interval.ms}
  - {key: offsets.storage.topic}
