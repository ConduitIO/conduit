# Upstream key snapshot for rules/data/mirror-source.yaml: the
# MirrorSourceConnector keys of Apache Kafka 4.2.0 with their defaults.
#
# Transcribed by hand from the 4.2.0 sources: MirrorConnectorConfig.java
# (base keys), MirrorSourceConfig.java, MirrorClientConfig.java,
# DefaultTopicFilter.java, DefaultConfigPropertyFilter.java and
# DefaultReplicationPolicy.java (connect/mirror and connect/mirror-client).
# The upstream-drift job (lane-plan PR 20) will regenerate it.
# The cluster-prefixed client keys (source.cluster.*, target.cluster.*,
# consumer.*, source.consumer.*, producer.*) are open-ended prefixes and are
# covered by prefix rules, not listed here.
scope: source
class: org.apache.kafka.connect.mirror.MirrorSourceConnector
upstream: {name: kafka, version: "4.2"}
sources:
  - https://github.com/apache/kafka/blob/4.2.0/connect/mirror/src/main/java/org/apache/kafka/connect/mirror/MirrorConnectorConfig.java
  - https://github.com/apache/kafka/blob/4.2.0/connect/mirror/src/main/java/org/apache/kafka/connect/mirror/MirrorSourceConfig.java
  - https://github.com/apache/kafka/blob/4.2.0/connect/mirror-client/src/main/java/org/apache/kafka/connect/mirror/MirrorClientConfig.java
keys:
  - {key: enabled, default: "true"}
  - {key: source.cluster.alias}
  - {key: target.cluster.alias, default: target}
  - {key: replication.policy.class, default: org.apache.kafka.connect.mirror.DefaultReplicationPolicy}
  - {key: replication.policy.separator, default: "."}
  - {key: replication.policy.internal.topic.separator.enabled, default: "true"}
  - {key: admin.timeout.ms, default: "60000"}
  - {key: forwarding.admin.class, default: org.apache.kafka.clients.admin.ForwardingAdmin}
  - {key: topic.filter.class, default: org.apache.kafka.connect.mirror.DefaultTopicFilter}
  - {key: offset-syncs.topic.location, default: source}
  - {key: emit.offset-syncs.enabled, default: "true"}
  - {key: topics, default: ".*"}
  - {key: topics.exclude, default: 'mm2.*\.internal, .*\.replica, __.*'}
  - {key: config.properties.exclude, default: 'follower\.replication\.throttled\.replicas, leader\.replication\.throttled\.replicas, message\.timestamp\.difference\.max\.ms, message\.timestamp\.type, unclean\.leader\.election\.enable, min\.insync\.replicas'}
  - {key: config.property.filter.class, default: org.apache.kafka.connect.mirror.DefaultConfigPropertyFilter}
  - {key: consumer.poll.timeout.ms, default: "1000"}
  - {key: refresh.topics.enabled, default: "true"}
  - {key: refresh.topics.interval.seconds, default: "600"}
  - {key: sync.topic.configs.enabled, default: "true"}
  - {key: sync.topic.configs.interval.seconds, default: "600"}
  - {key: sync.topic.acls.enabled, default: "true"}
  - {key: sync.topic.acls.interval.seconds, default: "600"}
  - {key: replication.factor, default: "2"}
  - {key: offset-syncs.topic.replication.factor, default: "3"}
  - {key: offset.lag.max, default: "100"}
  - {key: heartbeats.replication.enabled, default: "true"}
  - {key: source.cluster.bootstrap.servers}
  - {key: target.cluster.bootstrap.servers}
