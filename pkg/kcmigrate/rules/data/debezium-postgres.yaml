defaults:
  - key: plugin.name
    default: decoderbufs
    note:
      code: kc.default_differs
      reason: plugin.name is absent, so Debezium uses decoderbufs; Conduit decodes with pgoutput only, and decoder-specific differences are not emulated.
      fix: Set plugin.name=pgoutput in the Kafka Connect config, or accept the difference.
  - key: table.include.list
    default: ""
    note:
      code: kc.default_differs
      reason: table.include.list is absent, so Debezium reads every table; the source is set to tables "*", whose schema coverage is connector-defined.
      fix: Set table.include.list to the tables to read, or accept the difference.
