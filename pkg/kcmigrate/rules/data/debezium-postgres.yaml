  # --- Error handling and batch ---
  - key: event.processing.failure.handling.mode
    diff: behavior
    ignoreCase: true
    values:
      - match: [fail]
        status: translated
        reason: The pipeline stops on a failed event, as Debezium does.
        emit: {kind: none}
      - match: [warn, skip]
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: warn and skip drop events, which Conduit's at-least-once guarantee forbids.
        fix: Use fail, or keep this connector on Kafka Connect.
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Not a recognized failure handling mode.
        fix: Set fail, warn or skip.
