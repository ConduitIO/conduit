# MirrorMaker 2 in connector form (org.apache.kafka.connect.mirror.MirrorSourceConnector)
# to builtin:kafka source (the source cluster) and builtin:kafka destination.
# Mapping design 20261014-migrate-kafka-connect-mapping-and-harness.md,
# "MirrorMaker-style Kafka to Kafka", with two corrections from the Apache
# Kafka 4.3.1 sources:
#   - MirrorSourceTask reads the source cluster with its own consumer:
#     source.cluster.* (client keys only), then the connector's consumer.*,
#     then source.consumer.* (MirrorConnectorConfig.sourceConsumerConfig).
#     Those layer onto the pipeline's source.
#   - The records are written by Kafka Connect's producer, to the worker's
#     cluster (Worker.baseProducerConfigs), not by a target.cluster.* client.
#     target.cluster.* is MirrorMaker's own target admin and offset-sync
#     client; it fills the destination only when neither the worker nor a
#     producer.override.* key does (layer fallback). A correct deployment has
#     the two equal.
# v0.21 never writes the Kafka mirror settings (design
# 20261012-kafka-mirror-passthrough.md): partitions, headers and timestamps
# are not preserved, which the class note says on every migration.
rulesVersion: 1
scope: source
class: org.apache.kafka.connect.mirror.MirrorSourceConnector
upstream: {name: kafka, version: "4.3"}
emits:
  - {plugin: builtin:kafka, role: source}
  - {plugin: builtin:kafka, role: destination}
finish:
  # No default (MirrorConnectorConfig.java:274-278, 4.3.1): Kafka Connect
  # rejects a config without it.
  - {kind: require-key, key: source.cluster.alias}
  - {kind: mm2-topic}
  # MirrorMaker reads a partition with no stored offset from the beginning
  # (sourceConsumerConfig puts auto.offset.reset=earliest if absent,
  # MirrorConnectorConfig.java:189, 4.3.1); the Kafka source starts at the end.
  - {kind: default-setting, side: source, name: readFromBeginning, value: "true"}
  # Says where the pipeline starts; after default-setting.
  - {kind: mm2-offsets}
notes:
  - code: kc.output_shape_differs
    blocking: true
    reason: Records keep their key, value and topic name (per the replication policy), but not their partition, headers or timestamp. This version does not write the Kafka mirror settings; the destination partitions by key and stamps the time of writing.
    fix: Keep this flow on MirrorMaker if consumers rely on partition numbers, headers or record timestamps, or accept the difference with --accept-gaps.
keys:
  - key: source.cluster.bootstrap.servers
    status: translated
    reason: The pipeline reads the source cluster.
    emit: {kind: setting, side: source, name: servers}
    diff: identity
  - key: source.cluster.security.protocol
    diff: identity
    ignoreCase: true
    values:
      - match: [PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL]
        status: translated
        emit: {kind: tls-from-protocol, side: source}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Not a Kafka security protocol.
        fix: Use PLAINTEXT, SSL, SASL_PLAINTEXT or SASL_SSL.
  - key: source.cluster.sasl.mechanism
    diff: identity
    values:
      - match: [PLAIN, SCRAM-SHA-256, SCRAM-SHA-512]
        status: translated
        emit: {kind: setting, side: source, name: saslMechanism}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: The Kafka connector supports PLAIN, SCRAM-SHA-256 and SCRAM-SHA-512 only (not GSSAPI or OAUTHBEARER).
        fix: Use a supported mechanism, or keep this flow on MirrorMaker.
  - key: source.cluster.sasl.jaas.config
    status: translated
    emit: {kind: sasl-jaas, side: source}
    secret: true
    diff: secret
  - key: {prefix: source.cluster.ssl.}
    status: unsupported
    blocking: true
    code: kc.key_unsupported
    reason: The Kafka connector takes PEM certificates (caCert, clientCert, clientKey), not Java key stores, and has no cipher or protocol settings.
    fix: Export the stores as PEM and set caCert, clientCert and clientKey on the pipeline by hand.
    diff: identity
  - key: {prefix: source.cluster.}
    status: unsupported
    code: kc.key_unsupported
    reason: A source-cluster client setting with no Kafka connector equivalent (tuning, buffers, fetch sizes).
    fix: None needed; the Kafka connector's defaults apply.
    diff: tuning
  - key: consumer.bootstrap.servers
    status: translated
    reason: MirrorMaker's consumer reads consumer.* above source.cluster.*.
    emit: {kind: setting, side: source, name: servers, layer: client}
    diff: identity
  - key: consumer.security.protocol
    diff: identity
    ignoreCase: true
    values:
      - match: [PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL]
        status: translated
        emit: {kind: tls-from-protocol, side: source, layer: client}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Not a Kafka security protocol.
        fix: Use PLAINTEXT, SSL, SASL_PLAINTEXT or SASL_SSL.
  - key: consumer.sasl.mechanism
    diff: identity
    values:
      - match: [PLAIN, SCRAM-SHA-256, SCRAM-SHA-512]
        status: translated
        emit: {kind: setting, side: source, name: saslMechanism, layer: client}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: The Kafka connector supports PLAIN, SCRAM-SHA-256 and SCRAM-SHA-512 only (not GSSAPI or OAUTHBEARER).
        fix: Use a supported mechanism, or keep this flow on MirrorMaker.
  - key: consumer.sasl.jaas.config
    status: translated
    emit: {kind: sasl-jaas, side: source, layer: client}
    secret: true
    diff: secret
  - key: {prefix: consumer.ssl.}
    status: unsupported
    blocking: true
    code: kc.key_unsupported
    reason: The Kafka connector takes PEM certificates (caCert, clientCert, clientKey), not Java key stores, and has no cipher or protocol settings.
    fix: Export the stores as PEM and set caCert, clientCert and clientKey on the pipeline by hand.
    diff: identity
  - key: consumer.auto.offset.reset
    diff: behavior
    ignoreCase: true
    values:
      - match: [earliest]
        status: translated
        reason: Applies only to partitions with no stored offsets, which after migration is every partition (see kc.offsets_not_migrated); they are read from the beginning, as MirrorMaker reads them.
        emit: {kind: setting, side: source, name: readFromBeginning, value: "true", layer: client}
      - match: [latest]
        status: translated
        reason: Applies only to partitions with no stored offsets, which after migration is every partition (see kc.offsets_not_migrated); they are read from the end, as MirrorMaker reads them.
        emit: {kind: setting, side: source, name: readFromBeginning, value: "false", layer: client}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: The Kafka source starts a partition with no stored offset at the beginning or the end only; with none MirrorMaker fails on such a partition, and migrate carries no stored offsets over, so every partition would.
        fix: Set auto.offset.reset to earliest or latest.
  - key: consumer.isolation.level
    diff: behavior
    values:
      - match: [read_uncommitted]
        status: translated
        reason: The Kafka source reads uncommitted records too, as MirrorMaker does by default.
        emit: {kind: none}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: The Kafka source has no isolation setting and reads uncommitted records, including those of aborted transactions, which read_committed hides.
        fix: Keep this flow on MirrorMaker if consumers rely on read_committed, or accept the difference with --accept-gaps.
  - key: {prefix: consumer.}
    status: unsupported
    code: kc.key_unsupported
    reason: A setting of MirrorMaker's source consumer with no Kafka connector equivalent; MirrorMaker assigns partitions itself, so group.id has no effect either.
    fix: None needed; the Kafka connector's defaults apply.
    diff: tuning
  - key: source.consumer.bootstrap.servers
    status: translated
    reason: MirrorMaker's consumer reads source.consumer.* above source.cluster.*.
    emit: {kind: setting, side: source, name: servers, layer: cluster-client}
    diff: identity
  - key: source.consumer.security.protocol
    diff: identity
    ignoreCase: true
    values:
      - match: [PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL]
        status: translated
        emit: {kind: tls-from-protocol, side: source, layer: cluster-client}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Not a Kafka security protocol.
        fix: Use PLAINTEXT, SSL, SASL_PLAINTEXT or SASL_SSL.
  - key: source.consumer.sasl.mechanism
    diff: identity
    values:
      - match: [PLAIN, SCRAM-SHA-256, SCRAM-SHA-512]
        status: translated
        emit: {kind: setting, side: source, name: saslMechanism, layer: cluster-client}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: The Kafka connector supports PLAIN, SCRAM-SHA-256 and SCRAM-SHA-512 only (not GSSAPI or OAUTHBEARER).
        fix: Use a supported mechanism, or keep this flow on MirrorMaker.
  - key: source.consumer.sasl.jaas.config
    status: translated
    emit: {kind: sasl-jaas, side: source, layer: cluster-client}
    secret: true
    diff: secret
  - key: {prefix: source.consumer.ssl.}
    status: unsupported
    blocking: true
    code: kc.key_unsupported
    reason: The Kafka connector takes PEM certificates (caCert, clientCert, clientKey), not Java key stores, and has no cipher or protocol settings.
    fix: Export the stores as PEM and set caCert, clientCert and clientKey on the pipeline by hand.
    diff: identity
  - key: source.consumer.auto.offset.reset
    diff: behavior
    ignoreCase: true
    values:
      - match: [earliest]
        status: translated
        reason: Applies only to partitions with no stored offsets, which after migration is every partition (see kc.offsets_not_migrated); they are read from the beginning, as MirrorMaker reads them.
        emit: {kind: setting, side: source, name: readFromBeginning, value: "true", layer: cluster-client}
      - match: [latest]
        status: translated
        reason: Applies only to partitions with no stored offsets, which after migration is every partition (see kc.offsets_not_migrated); they are read from the end, as MirrorMaker reads them.
        emit: {kind: setting, side: source, name: readFromBeginning, value: "false", layer: cluster-client}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: The Kafka source starts a partition with no stored offset at the beginning or the end only; with none MirrorMaker fails on such a partition, and migrate carries no stored offsets over, so every partition would.
        fix: Set auto.offset.reset to earliest or latest.
  - key: source.consumer.isolation.level
    diff: behavior
    values:
      - match: [read_uncommitted]
        status: translated
        reason: The Kafka source reads uncommitted records too, as MirrorMaker does by default.
        emit: {kind: none}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: The Kafka source has no isolation setting and reads uncommitted records, including those of aborted transactions, which read_committed hides.
        fix: Keep this flow on MirrorMaker if consumers rely on read_committed, or accept the difference with --accept-gaps.
  - key: {prefix: source.consumer.}
    status: unsupported
    code: kc.key_unsupported
    reason: A setting of MirrorMaker's source consumer with no Kafka connector equivalent; MirrorMaker assigns partitions itself, so group.id has no effect either.
    fix: None needed; the Kafka connector's defaults apply.
    diff: tuning
  - key: consumer.override.auto.offset.reset
    status: unsupported
    code: kc.key_unsupported
    reason: Kafka Connect applies consumer overrides to a source connector's offsets consumer only; MirrorMaker's data consumer is configured by source.cluster.*, consumer.* and source.consumer.*.
    fix: None needed.
    diff: tuning
  - key: consumer.override.group.id
    status: unsupported
    code: kc.key_unsupported
    reason: Kafka Connect applies consumer overrides to a source connector's offsets consumer only; MirrorMaker's data consumer is configured by source.cluster.*, consumer.* and source.consumer.*.
    fix: None needed.
    diff: tuning
  - key: consumer.override.client.id
    status: unsupported
    code: kc.key_unsupported
    reason: Kafka Connect applies consumer overrides to a source connector's offsets consumer only; MirrorMaker's data consumer is configured by source.cluster.*, consumer.* and source.consumer.*.
    fix: None needed.
    diff: tuning
  - key: consumer.override.security.protocol
    status: unsupported
    code: kc.key_unsupported
    reason: Kafka Connect applies consumer overrides to a source connector's offsets consumer only; MirrorMaker's data consumer is configured by source.cluster.*, consumer.* and source.consumer.*.
    fix: None needed.
    diff: tuning
  - key: consumer.override.sasl.mechanism
    status: unsupported
    code: kc.key_unsupported
    reason: Kafka Connect applies consumer overrides to a source connector's offsets consumer only; MirrorMaker's data consumer is configured by source.cluster.*, consumer.* and source.consumer.*.
    fix: None needed.
    diff: tuning
  - key: consumer.override.sasl.jaas.config
    status: unsupported
    code: kc.key_unsupported
    reason: Kafka Connect applies consumer overrides to a source connector's offsets consumer only; MirrorMaker's data consumer is configured by source.cluster.*, consumer.* and source.consumer.*.
    fix: None needed.
    diff: tuning
  - key: consumer.override.bootstrap.servers
    status: unsupported
    code: kc.key_unsupported
    reason: Kafka Connect applies consumer overrides to a source connector's offsets consumer only; MirrorMaker's data consumer is configured by source.cluster.*, consumer.* and source.consumer.*.
    fix: None needed.
    diff: tuning
  - key: {prefix: consumer.override.ssl.}
    status: unsupported
    code: kc.key_unsupported
    reason: Kafka Connect applies consumer overrides to a source connector's offsets consumer only; MirrorMaker's data consumer is configured by source.cluster.*, consumer.* and source.consumer.*.
    fix: None needed.
    diff: tuning
  - key: {prefix: consumer.override.}
    status: unsupported
    code: kc.key_unsupported
    reason: Kafka Connect applies consumer overrides to a source connector's offsets consumer only.
    fix: None needed.
    diff: tuning
  - key: target.cluster.bootstrap.servers
    status: translated
    reason: Kafka Connect's producer writes the records to the worker's cluster; this fills the destination's servers when neither the worker file nor producer.override.bootstrap.servers sets them, and MirrorMaker requires the two to be the same cluster.
    emit: {kind: setting, side: destination, name: servers, layer: fallback}
    diff: identity
  - key: target.cluster.security.protocol
    diff: identity
    ignoreCase: true
    values:
      - match: [PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL]
        status: translated
        emit: {kind: tls-from-protocol, side: destination, layer: fallback}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Not a Kafka security protocol.
        fix: Use PLAINTEXT, SSL, SASL_PLAINTEXT or SASL_SSL.
  - key: target.cluster.sasl.mechanism
    diff: identity
    values:
      - match: [PLAIN, SCRAM-SHA-256, SCRAM-SHA-512]
        status: translated
        emit: {kind: setting, side: destination, name: saslMechanism, layer: fallback}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: The Kafka connector supports PLAIN, SCRAM-SHA-256 and SCRAM-SHA-512 only (not GSSAPI or OAUTHBEARER).
        fix: Use a supported mechanism, or keep this flow on MirrorMaker.
  - key: target.cluster.sasl.jaas.config
    status: translated
    emit: {kind: sasl-jaas, side: destination, layer: fallback}
    secret: true
    diff: secret
  - key: {prefix: target.cluster.ssl.}
    status: unsupported
    blocking: true
    code: kc.key_unsupported
    reason: The Kafka connector takes PEM certificates (caCert, clientCert, clientKey), not Java key stores, and has no cipher or protocol settings.
    fix: Export the stores as PEM and set caCert, clientCert and clientKey on the pipeline by hand.
    diff: identity
  - key: {prefix: target.cluster.}
    status: unsupported
    code: kc.key_unsupported
    reason: A target-cluster client setting of MirrorMaker's admin and offset-sync clients, with no Kafka connector equivalent.
    fix: None needed; the Kafka connector's defaults apply.
    diff: tuning
  - key: {prefix: producer.}
    status: unsupported
    code: kc.key_unsupported
    reason: A setting of MirrorMaker's offset-sync producer; Kafka Connect's own producer, which writes the records, takes producer.override.* instead.
    fix: None needed; the Kafka connector's defaults apply.
    diff: tuning
  - key: {prefix: source.producer.}
    status: unsupported
    code: kc.key_unsupported
    reason: A setting of MirrorMaker's offset-sync producer.
    fix: None needed; the Kafka connector's defaults apply.
    diff: tuning
  - key: {prefix: target.producer.}
    status: unsupported
    code: kc.key_unsupported
    reason: A setting of MirrorMaker's offset-sync producer.
    fix: None needed; the Kafka connector's defaults apply.
    diff: tuning
  - key: {prefix: source.admin.}
    status: unsupported
    code: kc.key_unsupported
    reason: A setting of MirrorMaker's admin client.
    fix: None needed; the Kafka connector's defaults apply.
    diff: tuning
  - key: {prefix: target.admin.}
    status: unsupported
    code: kc.key_unsupported
    reason: A setting of MirrorMaker's admin client.
    fix: None needed; the Kafka connector's defaults apply.
    diff: tuning
  - key: {prefix: admin.}
    status: unsupported
    code: kc.key_unsupported
    reason: A setting of MirrorMaker's admin client.
    fix: None needed; the Kafka connector's defaults apply.
    diff: tuning
  - key: source.cluster.alias
    status: translated
    reason: Used in the destination topic name (DefaultReplicationPolicy names it alias, separator, topic).
    emit: {kind: none}
    diff: identity
  - key: target.cluster.alias
    status: translated
    reason: A metrics label.
    emit: {kind: none}
    diff: tuning
  - key: replication.policy.class
    diff: identity
    values:
      - match: [org.apache.kafka.connect.mirror.DefaultReplicationPolicy, DefaultReplicationPolicy]
        status: translated
        reason: The destination topic is <alias><separator><topic>, written as a topic template.
        emit: {kind: none}
      - match: [org.apache.kafka.connect.mirror.IdentityReplicationPolicy, IdentityReplicationPolicy]
        status: translated
        reason: The destination topic keeps the source topic's name.
        emit: {kind: none}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: A custom replication policy names topics in code migrate cannot read.
        fix: Set the destination topic template on the pipeline by hand, or keep this flow on MirrorMaker.
  - key: replication.policy.separator
    status: translated
    reason: Used in the destination topic name.
    emit: {kind: none}
    diff: identity
  - key: replication.policy.internal.topic.separator.enabled
    status: translated
    reason: Applies to MirrorMaker's internal topics, which are not migrated.
    emit: {kind: none}
    diff: tuning
  - key: topics
    diff: identity
    values:
      # MirrorMaker's default topics.exclude (mm2.*\.internal, .*\.replica,
      # __.*, DefaultTopicFilter.java:36) drops these even when listed; the
      # pipeline would read them.
      - pattern: '^(.*,)?\s*(__[A-Za-z0-9._-]*|[A-Za-z0-9._-]*\.replica|mm2[A-Za-z0-9._-]*\.internal)\s*(,.*)?$'
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: A listed topic matches MirrorMaker's default topics.exclude (mm2.*\.internal, .*\.replica, __.*), so MirrorMaker never mirrored it; the pipeline would read it.
        fix: Remove the internal, replica and __-prefixed topics from topics, then re-run.
      - pattern: '^[A-Za-z0-9_-]+(\s*,\s*[A-Za-z0-9_-]+)*$'
        status: translated
        reason: A literal topic list.
        emit: {kind: list-setting, side: source, name: topics}
      - pattern: '^[A-Za-z0-9._-]+(\s*,\s*[A-Za-z0-9._-]+)*$'
        status: approximated
        code: kc.key_approximated
        reason: MirrorMaker treats each entry as a regex, where '.' matches any character; the pipeline reads exactly these topics, so a topic only the regex matched (orders.v1 also matching ordersXv1) is not mirrored.
        emit: {kind: list-setting, side: source, name: topics}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: The Kafka source takes a list of topics, not a pattern; MirrorMaker would also pick up new matching topics.
        fix: List the topics to mirror, separated by commas.
  - key: topics.exclude
    diff: identity
    values:
      - match: ['mm2.*\.internal, .*\.replica, __.*']
        status: translated
        reason: The default excludes internal topics, which a literal topic list does not include.
        emit: {kind: none}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: The Kafka source has no topic exclusion.
        fix: List only the topics to mirror in topics.
  - key: topic.filter.class
    diff: identity
    values:
      - match: [org.apache.kafka.connect.mirror.DefaultTopicFilter]
        status: translated
        emit: {kind: none}
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: A custom topic filter selects topics in code migrate cannot read.
        fix: List the topics to mirror in topics.
  - key: refresh.topics.enabled
    diff: behavior
    ignoreCase: true
    values:
      - match: ["false"]
        status: translated
        reason: Topics are fixed, as in the pipeline.
        emit: {kind: none}
      - match: ["true"]
        status: unsupported
        blocking: false
        code: kc.key_unsupported
        reason: 'New topics matching the selection are not discovered: the pipeline reads a fixed topic list.'
        fix: Re-run migrate after adding topics.
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Not a boolean.
        fix: Set true or false.
  - key: refresh.topics.interval.seconds
    status: translated
    reason: Only matters while refresh.topics.enabled is true, which is reported on its own.
    emit: {kind: none}
    diff: tuning
  - key: sync.topic.configs.enabled
    diff: behavior
    ignoreCase: true
    values:
      - match: ["false"]
        status: translated
        reason: Topic configs are not synced, as in the pipeline.
        emit: {kind: none}
      - match: ["true"]
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Topic configs (retention, cleanup.policy, compaction) are not synced to the destination.
        fix: Create the destination topics ahead of time with the source topics' configs.
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Not a boolean.
        fix: Set true or false.
  - key: sync.topic.configs.interval.seconds
    status: translated
    reason: Only matters while sync.topic.configs.enabled is true, which is reported on its own.
    emit: {kind: none}
    diff: tuning
  - key: metric.names.formats
    status: translated
    reason: Names MirrorMaker's own JMX metrics (legacy, new, or both; deprecated in 4.3, removed in 5.0), which describe no record. It has no effect on the pipeline, which reports Conduit's metrics.
    emit: {kind: none}
    diff: tuning
  - key: config.properties.exclude
    status: unsupported
    code: kc.key_unsupported
    reason: Only matters while topic configs are synced, which the pipeline does not do.
    fix: None needed.
    diff: tuning
  - key: config.property.filter.class
    status: unsupported
    code: kc.key_unsupported
    reason: Only matters while topic configs are synced, which the pipeline does not do; sync.topic.configs.enabled reports that, blocking when on.
    fix: None needed.
    diff: tuning
  - key: sync.topic.acls.enabled
    diff: behavior
    ignoreCase: true
    values:
      - match: ["false"]
        status: translated
        reason: ACLs are not synced, as in the pipeline.
        emit: {kind: none}
      - match: ["true"]
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Topic ACLs are not synced to the destination cluster.
        fix: Set the ACLs on the destination topics ahead of time.
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Not a boolean.
        fix: Set true or false.
  - key: sync.topic.acls.interval.seconds
    status: translated
    reason: Only matters while sync.topic.acls.enabled is true, which is reported on its own.
    emit: {kind: none}
    diff: tuning
  - key: replication.factor
    status: unsupported
    code: kc.key_unsupported
    reason: MirrorMaker creates remote topics with this replication factor; Conduit's Kafka destination creates topics with the broker's defaults.
    fix: Create the destination topics ahead of time with the replication factor you need.
    diff: behavior
  - key: emit.offset-syncs.enabled
    diff: behavior
    ignoreCase: true
    values:
      - match: ["false"]
        status: translated
        reason: No offset syncs, as in the pipeline.
        emit: {kind: none}
      - match: ["true"]
        status: unsupported
        blocking: false
        code: kc.key_unsupported
        reason: Offset syncs are not written, so a MirrorCheckpointConnector cannot translate consumer offsets for this flow.
        fix: None if consumers do not fail over between the clusters; otherwise keep this flow on MirrorMaker.
      - otherwise: true
        status: unsupported
        blocking: true
        code: kc.key_unsupported
        reason: Not a boolean.
        fix: Set true or false.
  - key: offset-syncs.topic.location
    status: unsupported
    code: kc.key_unsupported
    reason: Offset syncs are not written.
    fix: None needed.
    diff: tuning
  - key: offset-syncs.topic.replication.factor
    status: unsupported
    code: kc.key_unsupported
    reason: Offset syncs are not written.
    fix: None needed.
    diff: tuning
