defaults:
  - key: topics
    default: ".*"
    note:
      code: kc.default_differs
      blocking: true
      reason: topics is absent, so MirrorMaker mirrors every topic; the pipeline needs a topic list.
      fix: Set topics to the list of topics to mirror, then re-run.
  - key: refresh.topics.enabled
    default: "true"
    note:
      code: kc.default_differs
      reason: refresh.topics.enabled is absent (true), so MirrorMaker discovers new topics; the pipeline reads a fixed topic list.
  - key: sync.topic.configs.enabled
    default: "true"
    note:
      code: kc.default_differs
      blocking: true
      reason: sync.topic.configs.enabled is absent (true), so MirrorMaker syncs topic configs to the destination; the pipeline does not.
      fix: Create the destination topics ahead of time with the source topics' configs, or set sync.topic.configs.enabled=false if they already match.
  - key: config.properties.exclude
    default: 'follower.replication.throttled.replicas, leader.replication.throttled.replicas, message.timestamp.difference.max.ms, log.message.timestamp.before.max.ms, log.message.timestamp.after.max.ms, message.timestamp.type, unclean.leader.election.enable, min.insync.replicas'
    coveredBy: kc.default_differs
  - key: config.property.filter.class
    default: org.apache.kafka.connect.mirror.DefaultConfigPropertyFilter
    coveredBy: kc.default_differs
  - key: sync.topic.acls.enabled
    default: "true"
    note:
      code: kc.default_differs
      blocking: true
      reason: sync.topic.acls.enabled is absent (true), so MirrorMaker syncs topic ACLs to the destination; the pipeline does not.
      fix: Set the ACLs on the destination topics ahead of time, or set sync.topic.acls.enabled=false.
  - key: replication.factor
    default: "2"
    note:
      code: kc.default_differs
      reason: replication.factor is absent, so MirrorMaker creates remote topics with replication factor 2; Conduit's Kafka destination creates topics with the broker's defaults.
  - key: emit.offset-syncs.enabled
    default: "true"
    note:
      code: kc.default_differs
      reason: emit.offset-syncs.enabled is absent (true), so MirrorMaker writes offset syncs for checkpointing; the pipeline does not, and consumer offsets cannot be translated for this flow.
  - key: offset-syncs.topic.location
    default: source
    coveredBy: kc.default_differs
  - key: offset-syncs.topic.replication.factor
    default: "3"
    coveredBy: kc.default_differs
  - key: offset.lag.max
    default: "100"
    coveredBy: kc.default_differs
  - key: heartbeats.replication.enabled
    default: "true"
    note:
      code: kc.default_differs
      reason: heartbeats.replication.enabled is absent (true), so MirrorMaker replicates heartbeat topics; the pipeline reads only the listed topics.
