# MirrorMaker 2's heartbeat connector (org.apache.kafka.connect.mirror.MirrorHeartbeatConnector).
# Mapping design 20261014-migrate-kafka-connect-mapping-and-harness.md,
# "MirrorMaker-style Kafka to Kafka": it produces no pipeline, non-blocking.
# MirrorHeartbeatTask only writes a heartbeat record to the heartbeats topic
# of its own cluster every emit.heartbeats.interval.seconds, for monitoring;
# it copies no data, so nothing is lost by not migrating it.
rulesVersion: 1
scope: source
class: org.apache.kafka.connect.mirror.MirrorHeartbeatConnector
upstream: {name: kafka, version: "4.2"}
pipeline: none
every:
  status: unsupported
  code: kc.connector_class_unsupported
  reason: MirrorHeartbeatConnector only writes heartbeat records to its cluster's heartbeats topic for monitoring and copies no data, so no pipeline is written for it.
  fix: None needed. Keep it on Kafka Connect if a dashboard or MirrorClient reads the heartbeats topic; the migrated MirrorSourceConnector pipeline does not replicate heartbeats.
