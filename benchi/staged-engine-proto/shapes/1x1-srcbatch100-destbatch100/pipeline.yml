# staged-engine prototype shape 1x1-srcbatch100-destbatch100 (AWS run 3): every source sdk.batch.size=100 / delay=10ms, destination sdk.batch.size=100 / delay=10ms. Generated by scripts/mkshape.py.
version: "2.2"
pipelines:
  - id: archv2-gate
    status: running
    name: archv2-gate
    connectors:
      - id: src-1
        type: source
        plugin: builtin:generator
        settings:
          format.type: structured
          format.options.id: int
          format.options.name: string
          operations: create
          sdk.batch.size: "100"
          sdk.batch.delay: "10ms"
      - id: sink-1
        type: destination
        plugin: builtin:file
        settings:
          path: /sink/sink-1.jsonl
          sdk.batch.size: "100"
          sdk.batch.delay: "10ms"
