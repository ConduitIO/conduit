# archv2-gate shape 4x4: 4 generator sources, 4 file sinks, default config.
#
# Every record from any source reaches every sink, so each sink counts the same
# number of records; the harness reports records per second per sink.
#
# Default config: sdk.batch.size and sdk.batch.delay unset (batches of one).
version: "2.2"
pipelines:
  - id: archv2-gate
    status: running
    name: archv2-gate
    connectors:
      - id: src-1
        type: source
        plugin: builtin:generator
        settings:
          format.type: structured
          format.options.id: int
          format.options.name: string
          operations: create
      - id: src-2
        type: source
        plugin: builtin:generator
        settings:
          format.type: structured
          format.options.id: int
          format.options.name: string
          operations: create
      - id: src-3
        type: source
        plugin: builtin:generator
        settings:
          format.type: structured
          format.options.id: int
          format.options.name: string
          operations: create
      - id: src-4
        type: source
        plugin: builtin:generator
        settings:
          format.type: structured
          format.options.id: int
          format.options.name: string
          operations: create
      - id: sink-1
        type: destination
        plugin: builtin:file
        settings:
          path: /sink/sink-1.jsonl
      - id: sink-2
        type: destination
        plugin: builtin:file
        settings:
          path: /sink/sink-2.jsonl
      - id: sink-3
        type: destination
        plugin: builtin:file
        settings:
          path: /sink/sink-3.jsonl
      - id: sink-4
        type: destination
        plugin: builtin:file
        settings:
          path: /sink/sink-4.jsonl
