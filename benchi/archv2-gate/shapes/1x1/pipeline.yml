# archv2-gate shape 1x1: one generator source, one file sink, default config.
#
# Default config is the point: nothing here sets sdk.batch.size or
# sdk.batch.delay, so each connector's own default applies. For
# builtin:generator on the SDK this repository pins (v0.18.1) that is
# sdk.batch.size 100 with an adaptive drain, NOT batches of one — the SDK's
# source default changed from 0 to 100 in SDK #433, released in v0.18.1.
# Postgres and S3 pin 0 deliberately; generator, kafka and file inherit 100.
# Check the pinned connector's connector.yaml before describing this shape's
# batch size, not the sibling checkout, which may be ahead of or behind what
# go.mod resolves. This is the configuration the gate is decided on.
#
# The sink is builtin:file writing one JSON record plus '\n' per record to the
# harness's sink volume. The harness counts those newlines; nothing here reads
# engine metrics. Both engines run this file unchanged; the only difference
# between arms is the --preview.pipeline-arch-v2 flag.
version: "2.2"
pipelines:
  - id: archv2-gate
    status: running
    name: archv2-gate
    connectors:
      - id: src-1
        type: source
        plugin: builtin:generator
        settings:
          format.type: structured
          format.options.id: int
          format.options.name: string
          operations: create
      - id: sink-1
        type: destination
        plugin: builtin:file
        settings:
          path: /sink/sink-1.jsonl
