# archv2-gate shape 2x2-batched: the 2x2 shape with source batching on
# (sdk.batch.size=100, sdk.batch.delay=10ms), the same values as
# benchi/archv2-nxm-batched.
#
# This is NOT part of the gate, which is decided on default config. It is here
# because arch-v2's per-pass cost amortizes with batch size
# (BenchmarkEnginePass in pkg/lifecycle-poc/funnel) and a gate reader will want
# to know how much of any default-config gap batching closes. 100/10ms was
# chosen as plainly batched, not tuned.
version: "2.2"
pipelines:
  - id: archv2-gate
    status: running
    name: archv2-gate
    connectors:
      - id: src-1
        type: source
        plugin: builtin:generator
        settings:
          format.type: structured
          format.options.id: int
          format.options.name: string
          operations: create
          sdk.batch.size: "100"
          sdk.batch.delay: "10ms"
      - id: src-2
        type: source
        plugin: builtin:generator
        settings:
          format.type: structured
          format.options.id: int
          format.options.name: string
          operations: create
          sdk.batch.size: "100"
          sdk.batch.delay: "10ms"
      - id: sink-1
        type: destination
        plugin: builtin:file
        settings:
          path: /sink/sink-1.jsonl
      - id: sink-2
        type: destination
        plugin: builtin:file
        settings:
          path: /sink/sink-2.jsonl
