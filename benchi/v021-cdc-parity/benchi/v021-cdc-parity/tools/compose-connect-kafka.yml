# Kafka Connect + Debezium Kafka-destination arm (connect-kafka):
#
#   kafka   — Apache Kafka 4.0.0 broker, single-node KRaft (no ZooKeeper).
#   connect — Kafka Connect 4.0.0 (quay.io/debezium/connect:3.2) with the
#             Debezium Postgres source connector on its plugin path.
#
# The Debezium Postgres source captures bench_source_i over pgoutput logical
# replication (the same wire protocol as Conduit's logrepl) and is itself the
# Kafka producer: it writes one Kafka message per INSERT/UPDATE/DELETE straight
# into topic cdcparitykafka.public.bench_source_i — Debezium's native producer
# via Kafka Connect, the exact analog of the conduit-kafka arm's
# builtin:kafka destination. No sink connector is involved, so there is no
# sink file or volume.
#
# The broker shares its image, config and container name (cdcparity-kafka) with
# the conduit-kafka arm, so the ground-truth count hook in ../bench.yml can run
# GetOffsetShell inside the SAME container for both arms.
#
# The Debezium source connector is registered over the Connect REST API by the
# register-connect-kafka step in ../bench.yml (post-tool), which runs only for
# this tool. See ../bench.yml for the exact connector config.
services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: cdcparity-kafka
    environment:
      CLUSTER_ID: "cdcparity-kafka-cluster"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://cdcparity-kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@cdcparity-kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - benchi

  connect:
    # Built by run.sh from tools/connect.Dockerfile: the Debezium connect image
    # with the Debezium Postgres source connector on its plugin path (plus the
    # FileStreamSink/JDBC/S3 sinks used by the other Connect arms).
    image: connect-debezium-jdbc:3.2
    container_name: cdcparity-connect-kafka
    pull_policy: never
    environment:
      BOOTSTRAP_SERVERS: "cdcparity-kafka:9092"
      GROUP_ID: "cdcparity-connect-kafka"
      CONFIG_STORAGE_TOPIC: "cdcparity-connect-kafka-config"
      OFFSET_STORAGE_TOPIC: "cdcparity-connect-kafka-offsets"
      STATUS_STORAGE_TOPIC: "cdcparity-connect-kafka-status"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      - kafka
    networks:
      - benchi

networks:
  benchi:
    external: true
