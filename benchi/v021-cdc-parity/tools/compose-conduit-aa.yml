# A/A control: the Conduit arm run against itself. Byte-for-byte the same
# image, pipeline and compose as compose-conduit.yml (only the container_name
# differs so benchi's docker collector and teardown keep the two arms apart).
#
# An A/B delta smaller than the spread between this arm and `conduit` means
# nothing — it is the harness's noise floor (see ../README.md and
# benchi/METHODOLOGY.md).
services:
  conduit:
    image: conduit-bench:v021-cdc-parity
    container_name: cdcparity-conduit-aa
    pull_policy: never
    command:
      - /app/conduit
      - run
      - --pipelines.path
      - /app/pipelines
      - --log.level
      - error
      - --log.format
      - json
    volumes:
      - ../pipelines/conduit.yml:/app/pipelines/conduit.yml:ro
      - cdcparity-sink:/sink
    networks:
      - benchi

volumes:
  cdcparity-sink:
    external: true

networks:
  benchi:
    external: true
