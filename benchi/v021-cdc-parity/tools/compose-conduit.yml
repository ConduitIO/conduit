# Conduit arm. Built from the working tree (v0.21 nightly) by run.sh:
#   docker build -t conduit-bench:v021-cdc-parity -f Dockerfile ../..
#
# The same image and pipeline are used by compose-conduit-aa.yml — the A/A
# control — so the spread between these two arms is run-to-run noise alone.
services:
  conduit:
    image: conduit-bench:v021-cdc-parity
    container_name: cdcparity-conduit
    # Built locally and never pushed; benchi's `docker compose pull` must not
    # try to fetch it.
    pull_policy: never
    command:
      - /app/conduit
      - run
      - --pipelines.path
      - /app/pipelines
      - --log.level
      - error
      - --log.format
      - json
    volumes:
      - ../pipelines/conduit.yml:/app/pipelines/conduit.yml:ro
      - cdcparity-sink:/sink
    networks:
      - benchi

volumes:
  cdcparity-sink:
    external: true

networks:
  benchi:
    external: true
