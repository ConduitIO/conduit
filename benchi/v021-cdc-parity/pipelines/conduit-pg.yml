# Conduit Postgres-destination arm: one pipeline per table —
# builtin:postgres CDC source (bench_source_i) -> builtin:postgres
# destination (bench_dest_i).
#
# Ground truth is the row count of the destination tables: the destination
# upserts on the record key (id) and deletes on delete events, so
# bench_dest_i mirrors the LIVE rows of bench_source_i (net inserts minus
# deletes). The pre/post-test hooks SELECT count(*) across bench_dest_* and
# the delta over the 60s window is the number of net rows captured. No
# Conduit metric is read.
#
# Equivalence notes (see ../README.md for the full list):
#   - snapshotMode: never, cdcMode: logrepl (pgoutput), withAvroSchema:
#     false — identical to the file-sink conduit arm and Debezium.
#   - sdk.batch.* and the destination exec mode are the shipped defaults unless
#     CONDUIT_BATCH_SIZE / PG_DEST_URL_EXTRA were set (a labelled tuned run).
#
# GENERATED by scripts/generate.sh from TABLES and CONDUIT_BATCH_SIZE
# (committed copy is the TABLES=1 default); run.sh regenerates it.
version: "2.2"
pipelines:
  - id: cdc-parity-pg-0
    status: running
    name: cdc-parity-pg-0
    description: >
      Postgres CDC source (bench_source_0, pgoutput/logrepl) -> Postgres
      destination (bench_dest_0). Ground truth = row count of bench_dest_0
      (summed across tables).
    connectors:
      - id: cdc-parity-pg-0:pg-src
        type: source
        plugin: builtin:postgres
        settings:
          url: "postgres://bench:bench@cdcparity-postgres:5432/bench?sslmode=disable"
          tables: "bench_source_0"
          cdcMode: "logrepl"
          snapshotMode: "never"
          logrepl.slotName: "conduit_slot_0"
          logrepl.publicationName: "conduit_pub_0"
          logrepl.autoCleanup: "false"
          logrepl.withAvroSchema: "false"

      - id: cdc-parity-pg-0:pg-dest
        type: destination
        plugin: builtin:postgres
        settings:
          url: "postgres://bench:bench@cdcparity-postgres:5432/bench?sslmode=disable"
          table: "bench_dest_0"

