# Conduit S3-destination arm: one pipeline per table —
# builtin:postgres CDC source (bench_source_i) -> builtin:s3 destination
# (MinIO bucket "bench").
#
# Ground truth is the records the sink writes: builtin:s3 format json
# writes one OpenCDC-shaped JSON object per line (Operation, Position,
# Payload, Key, Metadata), one object per source batch, so the SUM of
# `wc -l` across every object in the bucket is the number of CDC events
# actually delivered. No Conduit metric is read.
#
# Equivalence notes (see ../README.md for the full list):
#   - snapshotMode: never, cdcMode: logrepl (pgoutput), withAvroSchema:
#     shipped default (see CONDUIT_AVRO) — identical to the file-sink conduit arm and Debezium.
#   - format json: one line per record, the SAME per-record shape the file
#     sink writes; the S3 sink batches/partitions, so the source (not the
#     sink) is what is measured — a parity check, like conduit-pg.
#   - aws.endpoint + aws.pathStyle point at the local MinIO (no MINIO_DOMAIN,
#     so path-style addressing is required).
#
# GENERATED by scripts/generate.sh from TABLES and CONDUIT_BATCH_SIZE
# (committed copy is the TABLES=1 default); run.sh regenerates it.
version: "2.2"
pipelines:
  - id: cdc-parity-s3-0
    status: running
    name: cdc-parity-s3-0
    description: >
      Postgres CDC source (bench_source_0, pgoutput/logrepl) -> S3
      destination (MinIO bucket "bench"). Ground truth = records written to the
      bucket (one JSON line per record, summed across tables).
    connectors:
      - id: cdc-parity-s3-0:pg-src
        type: source
        plugin: builtin:postgres
        settings:
          url: "postgres://bench:bench@cdcparity-postgres:5432/bench?sslmode=disable"
          tables: "bench_source_0"
          cdcMode: "logrepl"
          snapshotMode: "never"
          logrepl.slotName: "conduit_slot_0"
          logrepl.publicationName: "conduit_pub_0"
          logrepl.autoCleanup: "false"


      - id: cdc-parity-s3-0:s3-dest
        type: destination
        plugin: builtin:s3
        settings:
          aws.accessKeyId: "conduitminio"
          aws.secretAccessKey: "conduitminiosecret"
          aws.region: "us-east-1"
          aws.bucket: "bench"
          aws.endpoint: "http://cdcparity-minio:9000"
          aws.pathStyle: "true"
          format: "json"

