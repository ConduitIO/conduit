# Conduit Kafka-destination arm: one pipeline per table —
# builtin:postgres CDC source (bench_source_i) -> builtin:kafka destination
# (topic cdcparitykafka.public.bench_source_i).
#
# Ground truth is the topic's record count: each source record (one per
# INSERT/UPDATE/DELETE CDC event) becomes exactly one Kafka message, so the
# SUM of the topics' latest offsets (GetOffsetShell, one partition each) is
# the number of CDC events delivered. No Conduit metric is read.
#
# Equivalence notes (see ../README.md for the full list):
#   - snapshotMode: never, cdcMode: logrepl (pgoutput), withAvroSchema:
#     false — identical to the file-sink conduit arm and Debezium.
#   - the Kafka destination batches produces (franz-go, plus sdk.batch.size/
#     sdk.batch.delay), so the SOURCE — not the sink — is what is measured;
#     a parity check, like conduit-pg. Debezium's producer batches the same
#     way on the connect-kafka side.
#
# GENERATED by scripts/generate.sh from TABLES and CONDUIT_BATCH_SIZE
# (committed copy is the TABLES=1 default); run.sh regenerates it.
version: "2.2"
pipelines:
  - id: cdc-parity-kafka-0
    status: running
    name: cdc-parity-kafka-0
    description: >
      Postgres CDC source (bench_source_0, pgoutput/logrepl) -> Kafka
      destination (topic cdcparitykafka.public.bench_source_0). Ground truth =
      records produced to the topic (summed across tables).
    connectors:
      - id: cdc-parity-kafka-0:pg-src
        type: source
        plugin: builtin:postgres
        settings:
          url: "postgres://bench:bench@cdcparity-postgres:5432/bench?sslmode=disable"
          tables: "bench_source_0"
          cdcMode: "logrepl"
          snapshotMode: "never"
          logrepl.slotName: "conduit_kafka_slot_0"
          logrepl.publicationName: "conduit_kafka_pub_0"
          logrepl.autoCleanup: "false"
          logrepl.withAvroSchema: "false"

      - id: cdc-parity-kafka-0:kafka-dest
        type: destination
        plugin: builtin:kafka
        settings:
          servers: "cdcparity-kafka:9092"
          topic: "cdcparitykafka.public.bench_source_0"
          acks: "all"

