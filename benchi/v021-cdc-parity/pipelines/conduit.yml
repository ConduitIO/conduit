# Conduit arm: one pipeline per table — builtin:postgres CDC source
# (bench_source_i) -> builtin:file sink (/sink/out_i.txt).
#
# Ground truth is the files the sinks write: builtin:file appends exactly
# one line per record (record.Bytes() + '\n'), so the sum of
# `wc -l /sink/out_*.txt` is the number of CDC events actually delivered.
# No Conduit metric is read.
#
# Equivalence notes (see ../README.md for the full list):
#   - snapshotMode: never — no initial snapshot, matching Debezium
#     snapshot.mode=never and Redpanda stream_snapshot:false.
#   - logrepl.withAvroSchema: false — raw JSON payload, matching Debezium's
#     default and Redpanda's JSON message.
#   - cdcMode: logrepl — pgoutput logical replication, the same wire
#     protocol Debezium (plugin.name=pgoutput) and Redpanda use.
#   - sdk.batch.size: CONDUIT_BATCH_SIZE (default 1000) with a small
#     sdk.batch.delay so a partial batch still flushes; Debezium's
#     max.batch.size defaults to 2048.
#
# GENERATED by scripts/generate.sh from TABLES and CONDUIT_BATCH_SIZE
# (committed copy is the TABLES=1 default); run.sh regenerates it.
version: "2.2"
pipelines:
  - id: cdc-parity-0
    status: running
    name: cdc-parity-0
    description: >
      Postgres CDC source (bench_source_0, pgoutput/logrepl) -> file sink
      /sink/out_0.txt. Ground truth = lines written to /sink/out_0.txt
      (summed across tables).
    connectors:
      - id: cdc-parity-0:pg-src
        type: source
        plugin: builtin:postgres
        settings:
          url: "postgres://bench:bench@cdcparity-postgres:5432/bench?sslmode=disable"
          tables: "bench_source_0"
          cdcMode: "logrepl"
          snapshotMode: "never"
          logrepl.slotName: "conduit_slot_0"
          logrepl.publicationName: "conduit_pub_0"
          logrepl.autoCleanup: "false"
          logrepl.withAvroSchema: "false"
          sdk.batch.size: "1000"
          sdk.batch.delay: "100ms"
      - id: cdc-parity-0:file-dest
        type: destination
        plugin: builtin:file
        settings:
          path: /sink/out_0.txt
          sdk.batch.size: "1000"
          sdk.batch.delay: "100ms"
