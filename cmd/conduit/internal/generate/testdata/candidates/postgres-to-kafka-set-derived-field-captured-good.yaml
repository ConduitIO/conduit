version: "2.2"
pipelines:
  - id: postgres-orders-to-kafka
    status: running
    connectors:
      - id: pg-source
        type: source
        plugin: "builtin:postgres"
        settings:
          url: "postgres://user:TODO@localhost:5432/orders_db?sslmode=require"
          tables: "orders"
          cdcMode: auto
      - id: kafka-dest
        type: destination
        plugin: "builtin:kafka"
        settings:
          servers: "localhost:9092"
          topics: "orders"
    processors:
      - id: add-processed-at
        plugin: "builtin:field.set"
        settings:
          field: ".Payload.After.processed_at"
          value: "{{ now }}"
