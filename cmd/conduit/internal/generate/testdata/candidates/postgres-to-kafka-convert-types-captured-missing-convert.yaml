version: "2.2"
pipelines:
  - id: postgres-orders-to-kafka
    status: running
    connectors:
      - id: source
        type: source
        plugin: "builtin:postgres"
        settings:
          url: "TODO"
          tables: "orders"
          cdcMode: auto
      - id: destination
        type: destination
        plugin: "builtin:kafka"
        settings:
          servers: "localhost:9092"
          topics: "orders"
          acks: all
