# HAND-EDITED, not model output: the "-captured-good" fixture of the same request with its
# processors block (field.rename) removed. It stands for the shape the live eval accepted 3/3 before
# the judge fix, and is not a transcript of any real completion.
version: "2.2"
pipelines:
  - id: kafka-to-s3-archive
    status: running
    connectors:
      - id: source
        type: source
        plugin: "builtin:kafka"
        settings:
          servers: "localhost:9092"
          topics: "messages"
          groupID: "s3-archive-group"
      - id: destination
        type: destination
        plugin: "builtin:s3"
        settings:
          aws.accessKeyId: "TODO"
          aws.secretAccessKey: "TODO"
          aws.region: "us-east-1"
          aws.bucket: "archive-bucket"
          format: "json"
