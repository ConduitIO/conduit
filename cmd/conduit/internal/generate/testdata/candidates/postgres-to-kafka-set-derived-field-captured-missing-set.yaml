# HAND-EDITED, not model output: the "-captured-good" fixture of the same request with its
# processors block (field.set) removed. It stands for the shape the live eval accepted 3/3 before
# the judge fix, and is not a transcript of any real completion.
version: "2.2"
pipelines:
  - id: postgres-orders-to-kafka
    status: running
    connectors:
      - id: pg-source
        type: source
        plugin: "builtin:postgres"
        settings:
          url: "postgres://user:TODO@localhost:5432/orders_db?sslmode=require"
          tables: "orders"
          cdcMode: auto
      - id: kafka-dest
        type: destination
        plugin: "builtin:kafka"
        settings:
          servers: "localhost:9092"
          topics: "orders"
